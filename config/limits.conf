# The risk checks' limits (note 003): the defaults of include/ttt/limits.hpp, written out.
# Prices in four implied decimals, values in 1e-4 dollars, bands in basis points,
# windows in nanoseconds of market time (the ITCH timestamp).
max_volume = 10000                 # Art. 15(1)(c): shares an order
max_value = 1000000000             # Art. 15(1)(b): $100,000 an order
collar_bps = 500                   # Art. 15(1)(a): from the best ask, and below the best bid
period_collar_bps = 1000           # D2: from the period's reference price ...
period_ns = 60000000000            # ... a minute
max_messages = 1000                # Art. 15(1)(d): news, replaces and cancels ...
messages_window_ns = 1000000000    # ... a second
max_fills = 1000                   # D4, Art. 15(3): fills ...
fills_window_ns = 60000000000      # ... a minute, then the kill switch
instrument_exposure = 10000000000  # D5: $1 million an instrument
firm_exposure = 100000000000       # D5: $10 million for the firm
# permitted = TQQQ, QQQ           # Art. 15(5): empty or absent, every traded instrument
