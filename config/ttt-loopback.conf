# The program `ttt` (note 004) over loopback to order_venue on port 26500:
#   build/order_venue 26500 6 1 /tmp
#   build/ttt config/ttt-loopback.conf
# then our sender (build/feed_sender) drives the feed. Each run is a new
# session: remove the journal before the next.
arrangement = A
feed = feed-loopback.conf
strategy_cpu = 3
engine_cpu = 4
venue = 127.0.0.1
venue_port = 26500
journal = C
journal_path = /dev/shm/ttt.journal
journal_mb = 16384
instruments = open-100.txt
limits = limits.conf
block = /ttt
