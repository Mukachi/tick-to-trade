# The feed handler's keys (itch-feed-handler's note 009) for the program over
# loopback: our sender's group and ports, its snapshot service, the feed thread
# on CPU 2 and the standby book rebuilt on CPU 1. The same file runs `itchfh`
# in arrangement C, which needs its publisher.
port = 26400
server_port = 26401
snapshot_port = 26403
cpu = 2
rebuild_cpu = 1
publish = /itchfh-pub
monitor = /itchfh-mon
record_dir = none
